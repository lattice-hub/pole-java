name: 发布检查

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 拒绝 SNAPSHOT 候选
        run: |
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          case "$version" in
            *-SNAPSHOT) echo "版本仍是 $version"; exit 1 ;;
          esac
      - run: mvn --batch-mode clean verify
      - uses: actions/upload-artifact@v7
        with:
          name: pole-java-candidate
          path: |
            **/target/*.jar
            agent/pole-java-agent/target/*-distribution.zip
          if-no-files-found: error
