name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: 验证契约校验和
        run: |
          (cd contract && sha256sum --check SHA256SUMS)
          (cd contract/traffic-context/v1 && sha256sum --check SHA256SUMS)
      - name: 测试并打包
        run: mvn --batch-mode clean verify
