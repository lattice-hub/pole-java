name: 发布到 Maven Central

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v6
      - name: 设置 Java 与 Maven Central 凭据
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: 校验并设置发布版本
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "发布标签必须使用 vX.Y.Z 或 SemVer 预发布格式，当前为 $RELEASE_TAG"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          mvn --batch-mode org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="$version" \
            -DgenerateBackupPoms=false
          actual="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$actual" = "$version"
      - name: 验证并发布
        run: mvn --batch-mode --no-transfer-progress -Prelease clean deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
